services:
  folio:
    build: .
    container_name: folio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - FOLIO_WORKSPACE=/root/.folio
      - FOLIO_API_KEY=${TELEOSIS_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ${HOME}/.folio:/root/.folio
    networks:
      - web-routing

networks:
  web-routing:
    external: true
