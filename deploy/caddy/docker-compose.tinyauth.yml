services:
  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v3
    container_name: tinyauth
    restart: unless-stopped
    environment:
      - SECRET=${TINYAUTH_SECRET}
      - APP_URL=https://auth.teleosis.ai
      - USERS=${TINYAUTH_USERS}
      - SESSION_EXPIRY=2592000
    networks:
      - web-routing

networks:
  web-routing:
    external: true
